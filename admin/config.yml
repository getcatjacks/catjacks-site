backend:
  name: git-gateway
  branch: main

media_folder: "assets/gallery"
public_folder: "/assets/gallery"

collections:
  - name: "gallery"
    label: "CATJACKS Gallery"
    files:
      - file: "data/gallery.json"
        label: "Website Gallery Photos"
        name: "gallery"
        fields:
          - label: "Photos"
            name: "photos"
            widget: "list"
            summary: "{{fields.caption}} — {{fields.category}}"
            fields:
              - label: "Photo"
                name: "image"
                widget: "image"
              - label: "Caption"
                name: "caption"
                widget: "string"
                hint: "Short customer-friendly caption, e.g. Clean Ethernet wall jack behind TV."
              - label: "Alt Text"
                name: "alt"
                widget: "string"
                required: false
                hint: "Describe the photo for accessibility and SEO."
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - "Ethernet Wall Jacks"
                  - "TV Installs"
                  - "Wi-Fi Access Points"
                  - "Network Racks"
                  - "Attic Work"
                  - "Crawlspace Work"
                  - "Floor-to-Floor"
                  - "Before / After"
                  - "Tools & Testing"
                  - "Clean Finish"
