backend:
  name: git-gateway
  branch: main

media_folder: "assets/gallery"
public_folder: "/assets/gallery"

collections:
  - name: "gallery"
    label: "Gallery"
    files:
      - label: "Photos"
        name: "photos"
        file: "data/gallery.json"
        fields:
          - label: "Photos"
            name: "photos"
            widget: "list"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Caption", name: "caption", widget: "string" }
              - {
                  label: "Category",
                  name: "category",
                  widget: "select",
                  options:
                    [
                      "TV Installs",
                      "Ethernet Jacks",
                      "Wi-Fi Access Points",
                      "Attic Work",
                      "Crawlspace",
                      "Floor-to-Floor",
                      "Network Racks",
                      "Before / After"
                    ]
                }
